    <style>
        :root {

            --card: #ffffff;

            --accent: #b8860b;

        body {

            display: flex;

            background-color: var(--primary);
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.875rem 2rem;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45, 27, 14, 0.15);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-outline {
            transition: all 200ms ease;
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.875rem 2rem;
        }
        .btn-outline:hover {
            background-color: #f0e6d8;
            border-color: #c0a080;
        }

        .big-404 {
            font-size: clamp(8rem, 20vw, 15rem); /* even bigger */
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            user-select: none;
            -webkit-user-select: none;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .footer-text {
            font-size: 1rem;
        }

        .footer-tagline {

        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 100;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
            transition: transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
