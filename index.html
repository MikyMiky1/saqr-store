    <script>
        tailwind.config = {

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg: #faf6f0;
            --text: #3d2b1f;
            --muted: #7a6a5a;
            --border: #e8dcc9;
            --card: #ffffff;
            --primary: #2d1b0e;
            --primary-hover: #3d2b1f;
            --accent: #b8860b;
            --input-bg: #faf6f0;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: opacity 280ms ease;
        }

        .page-content {
            transition: opacity 280ms ease;
            opacity: 1;
        }
        .page-content.fading {
            opacity: 0;
        }

        .lang-toggle {
            position: relative;
            z-index: 10;
            cursor: pointer;
            transition: all 220ms ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .lang-toggle:active {
            transform: scale(0.95);
        }

        .btn-primary {
            transition: all 220ms ease;
            background-color: var(--primary);
            color: #ffffff;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45, 27, 14, 0.15);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }

        .option-card {
            transition: all 240ms ease;
            cursor: pointer;
            border: 2px solid var(--border);
            background-color: var(--bg);
        }
        .option-card:hover {
            border-color: #c0a080;
            background-color: #f0e6d8;
        }
        .option-card.selected {
            border-color: var(--accent);
            background-color: #fdf8f0;
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.08);
        }
        .option-card:active {
            transform: scale(0.975);
        }

        .color-btn {
            padding: 0.35rem;
            border-radius: 0.75rem;
            border: 2px solid var(--border);
            background: var(--bg);
            transition: all 220ms ease;
            cursor: pointer;
            width: calc(33.333% - 0.75rem);
            min-width: 90px;
            max-width: 150px;
            flex: 0 0 calc(33.333% - 0.75rem);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .color-btn:hover {
            border-color: #c0a080;
            transform: scale(1.02);
        }
        .color-btn.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.1);
            background: #fdf8f0;
        }
        .color-btn img {
            pointer-events: none;
            display: block;
            width: 100%;
            height: 7rem;
            object-fit: cover;
            border-radius: 0.5rem;
        }
        @media (max-width: 640px) {
            .color-btn {
                width: calc(50% - 0.5rem);
                flex: 0 0 calc(50% - 0.5rem);
                max-width: 100%;
            }
            .color-btn img {
                height: 6rem;
            }
        }

        /* Header */
        header {
            background-color: rgba(250, 246, 240, 0.92) !important;
            border-bottom: 1px solid var(--border) !important;
        }
        header .text-neutral-100 {
            color: var(--text) !important;
        }
        header .text-neutral-400 {
            color: var(--muted) !important;
        }
        header a:hover {
            color: var(--text) !important;
        }

        /* Hero */
        .hero-bg {
            background: linear-gradient(135deg, #fdf8f0 0%, #f0e6d8 100%);
            border-bottom: 1px solid var(--border) !important;
        }
        .hero-bg .text-neutral-50 {
            color: var(--text) !important;
        }
        .hero-bg .text-neutral-400 {
            color: var(--muted) !important;
        }
        .hero-bg .btn-primary {
            background-color: var(--primary) !important;
            color: #fff !important;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border) !important;
            background-color: var(--bg) !important;
        }
        footer .text-neutral-500 {
            color: var(--muted) !important;
        }
        footer .text-neutral-600 {
            color: #a89a8a !important;
        }
        footer .text-neutral-400 {
            color: var(--muted) !important;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 70;
            background-color: rgba(45, 27, 14, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: overlayIn 220ms ease;
        }
        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-container {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            width: 100%;
            max-width: 640px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
            position: relative;
        }
        .modal-container.closing {
            animation: modalOut 200ms ease forwards;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes modalOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(20px) scale(0.96); }
        }
    </style>
</head>

                document.body.appendChild(overlay);
                activeModalOverlay = overlay;

                // Query elements
                const closeBtn = overlay.querySelector('#modalCloseBtn');
                const modalVideo = overlay.querySelector('#modalVideo');
                const skipVideoBtn = overlay.querySelector('#skipVideoBtn');
                const confirmBtn = overlay.querySelector('#modalConfirmBtn');
                const modalPriceDisplay = overlay.querySelector('#modalPriceDisplay');
                const colorSelection = overlay.querySelector('#colorSelection');
                const colorBtns = overlay.querySelectorAll('.color-btn');
                const optionCards = overlay.querySelectorAll('.option-card');

                skipVideoBtn.addEventListener('click', () => {
                    if (modalVideo) {
                        modalVideo.pause();
                        modalVideo.style.display = 'none';
                        skipVideoBtn.style.display = 'none';
                    }
                });

                // Color selection visibility
                function updateColorVisibility() {
                    if (selectedOption === 'bag' || selectedOption === 'full') {
                        colorSelection.classList.remove('hidden');
                    } else {
                        colorSelection.classList.add('hidden');
                    }
                }

                // Price update
                function updatePrice() {
                    let price = fullPriceMap[selectedOption];
                    modalPriceDisplay.textContent = price.toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-US');
                }

                // Option selection
                optionCards.forEach(card => {
                    card.addEventListener('click', () => {
                        selectedOption = card.dataset.option;
                        optionCards.forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        updatePrice();
                        updateColorVisibility();
                    });
                });

                // Color selection
                colorBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedColor = btn.dataset.color;
                        colorBtns.forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    });
                });

                // Confirm button
                confirmBtn.addEventListener('click', () => {
                    handleConfirm(lang);
                });

                // Close button
                closeBtn.addEventListener('click', () => closeModal());

                // Esc to close
                const escHandler = (e) => {
                    if (e.key === 'Escape') closeModal();
                };
                overlay._escHandler = escHandler;
                document.addEventListener('keydown', escHandler);

                // Initial state
                updatePrice();
                updateColorVisibility();
            }

            function switchLanguage(targetLang) {
                if (!translations[targetLang] || currentLang === targetLang) return;

                if (activeModalOverlay) closeModal(true);

                pageContent?.classList.add('fading');

                setTimeout(() => {
                    htmlElement.lang = targetLang;
                    htmlElement.dir = targetLang === 'ar' ? 'rtl' : 'ltr';
                    updateStaticText(targetLang);
                    updateArrowDirection(targetLang);
                    currentLang = targetLang;
                    requestAnimationFrame(() => pageContent?.classList.remove('fading'));
                }, 260);
            }

            if (langToggle) {
                langToggle.addEventListener('click', () => {
                    switchLanguage(currentLang === 'ar' ? 'en' : 'ar');
                });

                langToggle.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        switchLanguage(currentLang === 'ar' ? 'en' : 'ar');
                    }
                });
            }

            if (heroBuyBtn) {
                heroBuyBtn.addEventListener('click', () => openModal(currentLang));
            }

            updateStaticText(currentLang);
            updateArrowDirection(currentLang);

        })();
    </script>
